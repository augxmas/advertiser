<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 수정 - 모노라마 광고 관리 시스템</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/css/broadsheet-app.css">
  <!-- 카카오 주소 검색 API -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
    .profile-form input { font-size: 16px; }
    .save-bar {
      display: flex; align-items: center; gap: 14px;
      margin-top: 56px; padding-top: 24px; border-top: 2px solid var(--color-text);
    }
    .save-bar .msg { margin-right: auto; font-family: var(--lbl); font-size: 13px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/dashboard">
      <span class="mark">M</span>
      <span>모노라마 광고 관리 시스템</span>
    </a>
    <div class="header-actions">
      <span class="username" id="hdrName"></span>
      <a class="btn btn-ghost" href="/dashboard" style="padding:6px 4px">캠페인 관리</a>
      <button class="btn btn-ghost" type="button" id="logoutBtn" style="padding:6px 4px">로그아웃</button>
    </div>
  </div>
</header>

<div class="wrap-narrow" style="padding:44px 0 80px">
  <nav class="sn" style="margin-bottom:20px;font-size:12.5px">
    <a href="/dashboard" style="text-decoration:none">캠페인 관리</a>
    <span style="color:color-mix(in srgb,var(--color-text) 40%,transparent)">/</span> 내 정보
  </nav>
  <h1 class="page-title">내 정보 수정</h1>
  <p class="sn" style="margin:14px 0 0;font-size:14px">기업 정보는 변경할 수 없습니다. 담당자 정보와 주소, 알림 설정을 관리하세요.</p>

  <div class="fld profile-form" style="margin-top:52px">
    <div class="sec">기업 정보 (변경 불가)</div>
    <div class="two" style="margin-bottom:26px">
      <div>
        <label for="pf_company">회사명</label>
        <input id="pf_company" readonly>
      </div>
      <div>
        <label for="pf_bizno">사업자등록번호</label>
        <input id="pf_bizno" readonly>
      </div>
    </div>
    <div style="margin-bottom:52px">
      <label for="pf_email">담당자 이메일</label>
      <input id="pf_email" readonly>
    </div>

    <div class="sec">담당자 정보</div>
    <div class="two" style="margin-bottom:26px">
      <div>
        <label for="pf_contact_name">담당자명 <span class="req">*</span></label>
        <input id="pf_contact_name" placeholder="담당자 성명" maxlength="50">
      </div>
      <div>
        <label for="pf_mobile">모바일폰 <span class="req">*</span></label>
        <input id="pf_mobile" placeholder="010-XXXX-XXXX" inputmode="numeric">
      </div>
    </div>
    <div style="margin-bottom:52px">
      <label for="pf_phone">일반전화</label>
      <input id="pf_phone" placeholder="숫자만 입력" inputmode="numeric">
    </div>

    <div class="sec">주소</div>
    <div style="margin-bottom:26px">
      <label for="pf_address1">주소1 <span class="req">*</span></label>
      <div style="display:flex;align-items:flex-end;gap:14px">
        <input id="pf_address1" readonly placeholder="주소 찾기 버튼을 클릭하세요">
        <button class="btn btn-outline" type="button" id="pf_addrBtn" style="flex:none;white-space:nowrap;font-size:14px;padding:9px 15px">🔍 주소 찾기</button>
      </div>
    </div>
    <div class="two" style="margin-bottom:52px">
      <div>
        <label for="pf_address2">주소2</label>
        <input id="pf_address2" placeholder="상세 주소" maxlength="100">
      </div>
      <div>
        <label for="pf_postal">우편번호 <span class="req">*</span></label>
        <input id="pf_postal" readonly placeholder="우편번호">
      </div>
    </div>

    <div class="sec">알림 설정</div>
    <div style="display:grid;gap:16px">
      <label class="check-row"><input type="checkbox" id="pf_push"><span>Push 알림 수신</span></label>
      <label class="check-row"><input type="checkbox" id="pf_email_consent"><span>이메일 수신 (광고 및 마케팅)</span></label>
    </div>

    <div class="save-bar">
      <span class="msg" id="pf_msg"></span>
      <a class="btn btn-ghost" href="/dashboard">← 뒤로가기</a>
      <button class="btn btn-primary" type="button" id="profileSaveBtn">저장</button>
    </div>
  </div>
</div>

<script src="/js/alert.js"></script>
<script src="/js/session.js"></script>
<script>
  /* ── 전화번호 포맷 유틸 ─────────────────────────────────────── */
  function digitsOnly(v) { return v.replace(/\D/g, ''); }
  function formatMobile(v) {
    const d = digitsOnly(v).slice(0, 11);
    if (d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    return d;
  }
  function formatPhone(v) {
    const d = digitsOnly(v).slice(0, 11);
    if (d.startsWith('02')) {
      if (d.length === 9)  return d.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
      if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
    } else {
      if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
      if (d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    }
    return d;
  }

  const pfMobileEl = document.getElementById('pf_mobile');
  pfMobileEl.addEventListener('input', () => { pfMobileEl.value = digitsOnly(pfMobileEl.value); });
  pfMobileEl.addEventListener('blur',  () => { pfMobileEl.value = formatMobile(pfMobileEl.value); });
  const pfPhoneEl = document.getElementById('pf_phone');
  pfPhoneEl.addEventListener('input', () => { pfPhoneEl.value = digitsOnly(pfPhoneEl.value); });
  pfPhoneEl.addEventListener('blur',  () => { if (pfPhoneEl.value) pfPhoneEl.value = formatPhone(pfPhoneEl.value); });

  /* ── 안내 메시지 ────────────────────────────────────────────── */
  function setMessage(text, ok) {
    const el = document.getElementById('pf_msg');
    el.textContent = text || '';
    el.style.color = ok ? 'var(--color-accent-700)' : 'var(--color-accent-2-700)';
  }
  ['pf_contact_name', 'pf_mobile', 'pf_phone', 'pf_address2'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => setMessage(''));
  });

  /* ── 카카오 주소 검색 ───────────────────────────────────────── */
  document.getElementById('pf_addrBtn').addEventListener('click', () => {
    new daum.Postcode({
      oncomplete: function (data) {
        document.getElementById('pf_address1').value = data.roadAddress || data.jibunAddress;
        document.getElementById('pf_postal').value   = data.zonecode;
        document.getElementById('pf_address2').focus();
        setMessage('');
      },
    }).open();
  });

  /* ── 로그아웃 ───────────────────────────────────────────────── */
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const ok = await MxAlert.confirm('로그아웃하시겠습니까?');
    if (!ok) return;
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/admin';
  });

  /* ── 프로필 로드 ────────────────────────────────────────────── */
  async function loadProfile() {
    try {
      const res  = await fetch('/api/auth/profile');
      const data = await res.json();
      if (!res.ok || !data.ok) {
        if (res.status === 401 || res.status === 403) { window.location.href = '/admin'; return; }
        return MxAlert.error(data.error || '정보를 불러오지 못했습니다.');
      }
      const p = data.profile;
      document.getElementById('pf_company').value        = p.company_name || '';
      document.getElementById('pf_bizno').value          = String(p.business_no || '').replace(/(\d{3})(\d{2})(\d{5})/, '$1-$2-$3');
      document.getElementById('pf_email').value          = p.contact_email || '';
      document.getElementById('pf_contact_name').value   = p.contact_name || '';
      document.getElementById('pf_mobile').value         = p.contact_mobile || '';
      document.getElementById('pf_phone').value          = p.contact_phone || '';
      document.getElementById('pf_address1').value       = p.address1 || '';
      document.getElementById('pf_address2').value       = p.address2 || '';
      document.getElementById('pf_postal').value         = p.postal_code || '';
      document.getElementById('pf_push').checked         = !!p.push_consent;
      document.getElementById('pf_email_consent').checked = !!p.email_consent;
      document.getElementById('hdrName').textContent     = (p.contact_name || '') + '님';
    } catch {
      MxAlert.error('서버 연결에 실패했습니다.');
    }
  }

  /* ── 저장 ───────────────────────────────────────────────────── */
  document.getElementById('profileSaveBtn').addEventListener('click', async function () {
    const contact_name   = document.getElementById('pf_contact_name').value.trim();
    const contact_mobile = document.getElementById('pf_mobile').value.trim();
    const contact_phone  = document.getElementById('pf_phone').value.trim();
    const address1       = document.getElementById('pf_address1').value.trim();
    const address2       = document.getElementById('pf_address2').value.trim();
    const postal_code    = document.getElementById('pf_postal').value.trim();
    const push_consent   = document.getElementById('pf_push').checked;
    const email_consent  = document.getElementById('pf_email_consent').checked;

    if (!contact_name)   return setMessage('담당자명을 입력해 주세요.', false);
    if (!contact_mobile) return setMessage('모바일폰을 입력해 주세요.', false);
    if (!address1)       return setMessage('주소를 입력해 주세요.', false);
    if (!postal_code)    return setMessage('우편번호를 입력해 주세요.', false);

    const confirmed = await MxAlert.confirm('변경사항을 저장하시겠습니까?');
    if (!confirmed) return;

    this.disabled = true;
    this.textContent = '저장 중...';
    try {
      const res = await fetch('/api/auth/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact_name, contact_mobile, contact_phone, address1, address2, postal_code, push_consent, email_consent }),
      });
      const data = await res.json();
      if (!res.ok) { setMessage(data.error || '저장에 실패했습니다.', false); return MxAlert.error(data.error || '저장에 실패했습니다.'); }
      document.getElementById('hdrName').textContent = contact_name + '님';
      setMessage('변경한 정보를 저장했습니다.', true);
      MxAlert.toast('프로필이 업데이트되었습니다.', 'success');
    } catch {
      setMessage('서버 연결에 실패했습니다.', false);
      MxAlert.error('서버 연결에 실패했습니다.');
    } finally {
      this.disabled = false;
      this.textContent = '저장';
    }
  });

  /* ── 인증 확인 후 로드 ──────────────────────────────────────── */
  (async function init() {
    try {
      const res  = await fetch('/api/auth/me');
      const data = await res.json();
      if (!data.ok) { window.location.href = '/admin'; return; }
      document.getElementById('hdrName').textContent = (data.user.contact_name || '') + '님';
      loadProfile();
    } catch {
      window.location.href = '/admin';
    }
  })();
</script>
</body>
</html>
