<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>페이지를 찾을 수 없습니다 - 모노라마</title>
  <link rel="icon" href="/favicon.svg?v=2">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef4ff,#f8fafc 55%,#e8efff);font-family:"Pretendard","Malgun Gothic",sans-serif;color:#1f2937}.box{width:min(560px,100%);padding:50px 38px;text-align:center;background:#fff;border:1px solid #dbe4f3;border-radius:18px;box-shadow:0 20px 55px rgba(30,64,175,.14)}.code{font-size:82px;line-height:1;font-weight:900;letter-spacing:-5px;color:#4865e7}.icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 22px;border-radius:50%;background:#eef3ff;color:#4865e7;font-size:34px}h1{margin:18px 0 12px;font-size:25px}p{margin:0;color:#6b7280;line-height:1.7}.actions{display:flex;justify-content:center;gap:10px;margin-top:30px;flex-wrap:wrap}a,button{min-width:130px;padding:12px 20px;border-radius:8px;border:1px solid #cbd5e1;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.primary{border-color:#4865e7;background:#4865e7;color:#fff}.secondary{background:#fff;color:#475569}
  </style>
</head>
<body><main class="box"><div class="icon">🔍</div><div class="code">404</div><h1>페이지를 찾을 수 없습니다</h1><p>요청하신 주소가 변경되었거나 존재하지 않습니다.<br>주소를 확인한 후 다시 시도해 주세요.</p><div class="actions"><a class="primary" href="/">홈으로 이동</a><button class="secondary" type="button" onclick="history.back()">이전 페이지</button></div></main></body>
</html>
