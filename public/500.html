<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서버 오류 - 모노라마</title>
  <link rel="icon" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
  <link rel="stylesheet" href="/css/broadsheet.css">
  <style>
    .err{
      max-width:var(--maxw);margin:0 auto;
      padding:clamp(64px,12vw,140px) var(--gutter) clamp(72px,10vw,120px);
    }
    .err-code{
      font-family:var(--font-heading);font-weight:var(--font-heading-weight);
      font-size:clamp(96px,17vw,200px);line-height:.9;letter-spacing:-.03em;
      color:var(--color-text);
      text-shadow:0 .055em .05em color-mix(in srgb,var(--color-neutral-900) 55%,transparent);
    }
    .err h1{
      margin-top:clamp(28px,4vw,44px);
      font-size:clamp(28px,4.4vw,46px);line-height:1.16;letter-spacing:-.02em;
    }
    .err p{max-width:52ch;margin:24px 0 0;font-size:17px}
    .err-hint{
      max-width:52ch;margin-top:28px;padding:16px 18px;
      background:var(--color-surface);
      font-family:var(--font-label);font-size:13px;line-height:1.7;
      color:color-mix(in srgb,var(--color-text) 70%,transparent);
    }
  </style>
</head>
<body>

  <nav class="site-nav" aria-label="주요 메뉴">
    <a class="nav-brand" href="/" aria-label="디-위드 광고 홈">
      <span class="nav-mark" aria-hidden="true">M</span>
      <span>디-위드 광고</span>
    </a>
    <a class="nav-link nav-login" href="/admin">로그인</a>
    <a class="btn btn-primary btn-sm" href="/register">광고주 회원가입</a>
  </nav>

  <main class="err">
    <p class="kicker kicker-sm">Error 500 — Server Error</p>
    <div class="err-code" aria-hidden="true">500</div>
    <h1>서버 오류가 발생했습니다</h1>
    <p class="muted">요청을 처리하는 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.</p>
    <p class="err-hint">문제가 계속되면 관리자에게 발생 시간과 요청 화면을 알려주세요.</p>
    <div class="actions">
      <button class="btn btn-primary btn-lg" type="button" onclick="location.reload()">다시 시도</button>
      <a class="btn btn-ghost btn-lg" href="/">홈으로 이동 →</a>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">(주)모노라마</p>
    <div class="footer-meta">
      <span>E-mail kimch@monorama.kr</span>
      <span>Tel 02-6925-4083</span>
    </div>
    <p class="footer-copy">© Monorama. All Rights Reserved.</p>
  </footer>

</body>
</html>
