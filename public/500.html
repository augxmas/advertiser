<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서버 오류 - 모노라마</title>
  <link rel="icon" href="/favicon.svg?v=2">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef4ff,#f8fafc 55%,#e8efff);font-family:"Pretendard","Malgun Gothic",sans-serif;color:#1f2937}.box{width:min(560px,100%);padding:50px 38px;text-align:center;background:#fff;border:1px solid #dbe4f3;border-radius:18px;box-shadow:0 20px 55px rgba(30,64,175,.14)}.code{font-size:82px;line-height:1;font-weight:900;letter-spacing:-5px;color:#4865e7}.icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 22px;border-radius:50%;background:#eef3ff;color:#4865e7;font-size:34px}h1{margin:18px 0 12px;font-size:25px}p{margin:0;color:#6b7280;line-height:1.7}.hint{margin-top:14px;padding:12px;border-radius:8px;background:#f8fafc;font-size:12px;color:#94a3b8}.actions{display:flex;justify-content:center;gap:10px;margin-top:30px;flex-wrap:wrap}a,button{min-width:130px;padding:12px 20px;border-radius:8px;border:1px solid #cbd5e1;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.primary{border-color:#4865e7;background:#4865e7;color:#fff}.secondary{background:#fff;color:#475569}
  </style>
</head>
<body><main class="box"><div class="icon">🛠️</div><div class="code">500</div><h1>서버 오류가 발생했습니다</h1><p>요청을 처리하는 중 문제가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</p><div class="hint">문제가 계속되면 관리자에게 발생 시간과 요청 화면을 알려주세요.</div><div class="actions"><button class="primary" type="button" onclick="location.reload()">다시 시도</button><a class="secondary" href="/">홈으로 이동</a></div></main></body>
</html>
